name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endorse-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: endorse-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: endorse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: endorse-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/endorse_test
      - run: npm run build

  routes-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routes-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: routes-api/go.mod
          cache-dependency-path: routes-api/go.sum
      - run: go vet ./...
      - run: go test -race -cover ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    needs: [endorse-api, routes-api, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [endorse-api, routes-api, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
